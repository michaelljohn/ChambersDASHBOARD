<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles/bootstrap.min.css">
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <title>Dashboard</title>
</head>
<body>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
        <form action="./assets/pages/login.html" class="bg-white p-4 rounded-3 shadow-sm musky-form" id="formField">

            <div class="mb-3">
            <h3 class="fw-bold mb-1">SIGN UP</h3>
            <p class="text-secondary small mb-0">Already have an account? Sign in.</p>
            </div>

            <div class="mb-3">
                <label for="name" class="form-label small fw-semibold">Name</label>
                <input type="text" class="form-control musky-input" id="name"  autocomplete="name" placeholder="Name" >
                <div id="nameError" class="invalid-feedback"></div>
            </div>

            <div class="mb-3">
            <label for="SignInMail" class="form-label small fw-semibold">Email</label>
            <input  class="form-control musky-input" id="SignInMail"  autocomplete="email" placeholder="you@email.com">
            <div id="emailError" class="invalid-feedback"></div>
            
            </div>

            <div class="mb-2">
            <label for="SignInPassword" class="form-label small fw-semibold">Password</label>
            <input type="password" class="form-control musky-input" id="SignInPassword"  autocomplete="current-password" placeholder="******">
            <div id="passwordError" class="invalid-feedback"></div>
            </div>

            <div class="text-end mb-3">
            <a href="./assets/pages/forgotpassword.html" class="small musky-link">Forgot Password?</a>
            </div>

            <button type="submit" role="button" class="btn w-100 fw-semibold musky-btn btn-primary" id="submit">SIGN IN</button>

        </form>
    </div>


    <script src="./assets/scripts/bootstrap.bundle.min.js"></script>
    <script src="./assets/scripts/index.js"></script>
</body>
</html>
