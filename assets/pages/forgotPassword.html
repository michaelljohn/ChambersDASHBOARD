<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/bootstrap.min.css">
    <title>Document</title>
</head>
<body>

    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">
        <form action="" class="bg-white p-4 rounded-3 shadow-sm musky-form">

            <div class="mb-3">
            <h3 class="fw-bold mb-1">Forgot Password</h3>
            <p class="text-secondary small mb-0">Enter your email to get code.</p>
            </div>

            <div class="mb-3">
            <label for="SignInMail" class="form-label small fw-semibold">Email</label>
            <input type="email" class="form-control musky-input" id="SignInMail" required placeholder="you@email.com">
            </div>

            <button type="submit" class="btn w-100 fw-semibold musky-btn">Send Reset Link</button>

            <p class="text-secondary small text-center mt-3 mb-0">If the account exists a reset link will be sent to the address.</p>

            <div class="text-center small mt-3">
            <a href="/index.html" class="musky-link fw-semibold btn btn-primary">Go back to login</a>
            </div>
        </form>
    </div>

  <script src="../scripts/bootstrap.bundle.min.js"></script>
</body>
</html>
