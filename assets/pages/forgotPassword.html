<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../styles/styles.css">
    <link rel="stylesheet" href="../styles/bootstrap.min.css">

    <title>Forgot Password</title>
</head>

<body>

    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

        <form
            id="forgotForm"
            class="bg-white p-4 rounded-3 shadow-sm musky-form"
        >

            <div class="mb-4">
                <h3 class="fw-bold mb-1">Forgot Password</h3>

                <p class="text-secondary small mb-0">
                    Enter your email and create a new password.
                </p>
            </div>


            <!-- Email -->
            <div class="mb-3">

                <label
                    for="resetEmail"
                    class="form-label small fw-semibold"
                >
                    Email
                </label>

                <input
                    type="email"
                    class="form-control musky-input"
                    id="resetEmail"
                    autocomplete="email"
                    placeholder="you@email.com"
                >

                <div
                    id="resetEmailError"
                    class="invalid-feedback"
                ></div>

            </div>


            <!-- New Password -->
            <div class="mb-3">

                <label
                    for="newPassword"
                    class="form-label small fw-semibold"
                >
                    New Password
                </label>

                <input
                    type="password"
                    class="form-control musky-input"
                    id="newPassword"
                    autocomplete="new-password"
                    placeholder="********"
                >

                <div
                    id="newPasswordError"
                    class="invalid-feedback"
                ></div>

            </div>


            <!-- Reset Message -->
            <div
                id="resetMessage"
                class="small mb-3"
            ></div>


            <!-- Reset Button -->
            <button
                type="submit"
                class="btn w-100 fw-semibold musky-btn btn-primary"
            >
                RESET PASSWORD
            </button>


            <!-- Back to Login -->
            <div class="text-center small mt-3">

                <a
                    href="./login.html"
                    class="musky-link fw-semibold"
                >
                    Back to Login
                </a>

            </div>

        </form>

    </div>


    <script src="../scripts/bootstrap.bundle.min.js"></script>
    <script src="../scripts/forgotpassword.js"></script>

</body>

</html>
